name = "dmarcheck"
main = "src/index.ts"
compatibility_date = "2026-06-30"
compatibility_flags = ["nodejs_compat", "nodejs_als"]
upload_source_maps = true

routes = [
  { pattern = "dmarc.mx", custom_domain = true },
]

[dev]
port = 8790

# Cloudflare Access enforcement for preview-branch deploys served on
# `*-dmarcheck.cory7593.workers.dev`. Inert on the production custom domain
# (`dmarc.mx`) — the middleware short-circuits on hostname before reading
# these. NOTE: top-level [vars] only — never add [env.<name>] blocks here
# (see feedback_workers_builds_env_pinning: doing so detached dmarc.mx on
# 2026-04-26 / PRs #203 → #206).
[vars]
ACCESS_AUD = "7b283d5d9b56f6fffa342280310a4ae68f13cbb05dc27f3c1d2faec2deae507a"
ACCESS_TEAM_DOMAIN = "coryrankin.cloudflareaccess.com"

# Self-host scoring rubric override (issue #25). A single JSON string of
# ScoringConfig knobs; absent or invalid → the shipped default rubric, so
# hosted dmarc.mx leaves this UNSET. Recognized keys (with defaults):
#   requireBimiForAPlus         (bool, true)  — A+ requires a BIMI record
#   requireMtaStsForAPlus       (bool, true)  — A+ requires enforcing MTA-STS
#   spfEfficientLookupThreshold (num,  5)     — SPF lookups ≤ this earn +1
#   dkimKeyMinBits              (num,  2048)  — keys below this incur −1
#   lowPctDowngradeThreshold    (num,  10)    — pct below this downgrades a tier
#   dkimRotationSelectorCount   (num,  2)     — this many selectors earn +1
# Example (self-hosters uncomment and edit):
# SCORING_CONFIG = '{"requireBimiForAPlus":false,"dkimKeyMinBits":4096}'

# Optional Spamhaus DQS (Data Query Service) key enabling the DNSBL/IP-reputation
# analyzer (issue #587). It is a SECRET — never set it here as a [vars] value and
# never commit a real key. Provision it out-of-band with:
#   wrangler secret put DNSBL_DQS_KEY
# Absent → the DNSBL analyzer is a clean no-op (informational, no grade impact),
# so self-host deploys and the test pool are unaffected. The key is embedded only
# in the outbound DQS query name (see queryDnsbl in src/dns/client.ts); it is
# never logged, returned in responses, or written into a cache key.

[triggers]
crons = ["17 6 * * *"]

# Atomic per-identity rate-limit counter (GHSA-v7qc-7qh8-h69g). The Cache API
# offered no atomic increment, so a concurrent burst under one identity could
# read the same stale count and collectively exceed the configured ceiling. A
# Durable Object serializes increments per identity (its single-threaded RPC),
# closing the race across isolates and colos. Optional at runtime:
# checkRateLimit() falls back to the in-memory limiter when this binding is
# absent (self-host deploys that strip it, and the Node test pool).
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]

[[d1_databases]]
binding = "DB"
database_name = "dmarcheck-db"
database_id = "7e6e7e64-5477-458f-b206-941ea58b7dba"
migrations_dir = "src/db/migrations"

# Cloudflare Email Sending for grade-drop alerts. alerts@dmarc.mx must be a
# verified sender in the Cloudflare dashboard before this binding delivers
# mail; the dispatcher catches E_SENDER_NOT_VERIFIED and skips gracefully.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["alerts@dmarc.mx"]

# Inbound test-email scanning (issue #417). Short-lived store (30-min TTL on
# every record) keyed by capability token: a "pending" reservation written on
# GET /check/email, overwritten with the parsed SPF/DKIM/DMARC verdict by the
# Email Worker `email()` handler when the test message arrives. This is the
# repo's FIRST KV namespace — the SSE scan cache (src/cache.ts) uses the Cache
# API, not KV.
#
# Top-level binding only — NEVER add an [env.<name>] block here (doing so
# detached dmarc.mx on 2026-04-26, PRs #203 → #206).
#
# Namespace created by the owner via `wrangler kv namespace create INBOX_TOKENS`.
# Remaining owner/zone-admin step (not committable): in Email Routing for
# dmarc.mx, create one rule `inbox@dmarc.mx` → "Send to a Worker" → dmarcheck and
# enable Subaddressing (Settings). Addresses are `inbox+<token>@dmarc.mx`; the
# specific rule outranks PhishSOC's zone catch-all, so only `inbox+*` reaches us.
[[kv_namespaces]]
binding = "INBOX_TOKENS"
id = "9194395b3f804f01bbbd14160b2a13bb"

name: PR provenance

# Server-side enforcement of routine-gate Condition 1 ONLY (#705): a PR whose
# linked issue was authored outside scripts/routine-gate/config.ts's
# allowlistAuthors fails this check. Every other gate.ts condition
# (spec-approved label, size envelope, scope-fit, risk paths) stays a
# routine-side auto-merge decision — see CLAUDE.md's routine-gate section.
#
# pull_request_target (not pull_request) is deliberate: it runs this workflow
# definition and checks out scripts/routine-gate/** from the BASE branch,
# never the PR head. A pull_request trigger would let a PR that also edits
# its own gate config evaluate itself against its own modified allowlist —
# exactly the self-modification gap CODEOWNERS' own header comment warns
# about ("a PR can otherwise rewrite its own merge gate"). No PR-supplied
# code is ever checked out or executed; PR content is read only through the
# GitHub API inside pr-provenance.ts, and only the PR number (an integer)
# and the fixed repo slug are passed as command-line arguments — no PR text
# is ever interpolated into a shell command.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  provenance:
    name: PR provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Explicit even though it's already pull_request_target's default —
          # this check's entire security property rests on evaluating the
          # BASE branch's gate config, never the PR's own modified copy.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Enforce issue-author provenance (routine-gate Condition 1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/routine-gate/pr-provenance.ts --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
